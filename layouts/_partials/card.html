{{ $cover := partial "cover.html" . }}
{{ $cat := partial "category.html" . }}
<article class="card{{ if not $cover }} card--text{{ end }}">
  {{ with $cover }}
    <a class="card__media" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true">
      <img src="{{ . }}" alt="" loading="lazy">
    </a>
  {{ end }}
  <div class="card__body">
    <p class="kicker">{{ with $cat }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ else }}Notes{{ end }}</p>
    <h3 class="card__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ if not $cover }}<p class="card__summary">{{ .Summary | plainify | truncate 140 }}</p>{{ end }}
    {{ partial "meta.html" . }}
  </div>
</article>
