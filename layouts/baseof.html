<!doctype html>
{{ $route := partial "route-lang.html" . }}
<html lang="{{ with $route }}{{ . }}{{ else }}{{ if eq .Kind "page" }}{{ partial "lang.html" . }}{{ else }}en{{ end }}{{ end }}"{{ with $route }} data-ui="{{ . }}"{{ end }}>
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.dataset.theme ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var next = current === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    });

    // Dropdown menus: click to open, click outside or Escape to close
    var toggles = document.querySelectorAll('.nav__toggle');
    function closeAll(except) {
      toggles.forEach(function (t) { if (t !== except) t.setAttribute('aria-expanded', 'false'); });
    }
    toggles.forEach(function (t) {
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = t.getAttribute('aria-expanded') === 'true';
        closeAll(t);
        t.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
    });
    document.addEventListener('click', function () { closeAll(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

    // EN | ES switch: shows one language of every bilingual text; remembered in this browser only
    document.querySelectorAll('[data-set-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.setLang === document.documentElement.dataset.ui);
      b.addEventListener('click', function () {
        document.documentElement.dataset.ui = b.dataset.setLang;
        document.querySelectorAll('[data-set-lang]').forEach(function (o) { o.setAttribute('aria-pressed', o === b); });
        try { localStorage.setItem('ui-lang', b.dataset.setLang); } catch (e) {}
        var alt = document.querySelector('link[rel=alternate][hreflang="' + b.dataset.setLang + '"]');
        if (alt) try { history.replaceState(null, '', new URL(alt.href).pathname + location.hash); } catch (e) {}
        document.documentElement.lang = b.dataset.setLang;
      });
    });
  </script>
</body>
</html>
