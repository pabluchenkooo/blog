    name = "Sports"
    identifier = "sports"
    weight = 1

  [[menus.main]]
    name = "Climbing"
    pageRef = "/posts/climbing"
    parent = "sports"
    weight = 1

  [[menus.main]]
    name = "Hiking"
    pageRef = "/posts/hiking"
    parent = "sports"
    weight = 2

  [[menus.main]]
    name = "Cycling"
    pageRef = "/posts/cycling"
    parent = "sports"
    weight = 3

  [[menus.main]]
    name = "Highlining"
    pageRef = "/posts/slackline"
    parent = "sports"
    weight = 4

  [[menus.main]]
    name = "Woodworking"
    pageRef = "/posts/woodworking"
    weight = 4

  [[menus.main]]
    name = "Trip Logs"
    pageRef = "/posts/trips"
    weight = 5

  [[menus.main]]
    name = "Thoughts"
