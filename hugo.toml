baseURL = "https://blog.pabluchenko.de/"
languageCode = "en-us"
title = "@pabluchenkooo"

summaryLength = 30
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[module]
[[module.imports]]
  path = 'github.com/theNewDynamic/gohugo-theme-ananke/v2'

[params]
  author = "Your Name"
  description = "Field notes from climbing walls, bikepacking routes, highlines, workshops, and wandering thoughts."

  mainSections = ["posts"]
  recent_posts_number = 6
  show_reading_time = true

  featured_image_class = "cover bg-center"
  background_color_class = "bg-near-white"
  body_classes = "serif"

  site_logo = ""
  favicon = ""

  # featured_image = "/images/hero.jpg"
  # text_color = "near-black"
  # twitter = "yourhandle"
  # instagram = "yourhandle"
  # github = "yourhandle"
  # google_analytics = ""

[params.ananke]
  show_recent_posts = true

