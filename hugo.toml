baseURL = "https://blog.pabluchenko.de/"
languageCode = "en-us"
title = "Pablo Junco"

summaryLength = 30
enableRobotsTXT = true

# Standalone images render as <figure> (positions/captions); images on
# consecutive lines stay in one paragraph and become a photo row.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[pagination]
  pagerSize = 12

[params]
  description = "Field notes from climbing walls, bikepacking routes, highlines, workshops, and wandering thoughts."

  [params.contact]
    # Formspree form endpoint, e.g. "https://formspree.io/f/abcdwxyz"
    formspree = ""

[menus]

  # A dropdown: the parent has an identifier, children point to it with parent = "..."
  [[menus.main]]
    name = "Sports"
    identifier = "sports"
    weight = 1

  [[menus.main]]
    name = "Climbing"
    pageRef = "/posts/climbing"
    parent = "sports"
    weight = 1

